name: CI

# 在 main 推送与所有 PR 上做编译校验（不打包），尽早发现破坏式改动。
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build check (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Go build & vet
        run: |
          cd app
          go build ./...
          go vet ./...

      - name: Frontend build
        run: |
          cd app/frontend
          npm ci
          npm run build
